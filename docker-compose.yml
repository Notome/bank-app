version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: bank_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: bank_db
      POSTGRES_USER: bank_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bank_user -d bank_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bank_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bank_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://bank_user:${DB_PASSWORD:-1234}@db:5432/bank_db
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production_please}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bank_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: bank_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - backend
    networks:
      - bank_net

  nginx:
    image: nginx:1.27-alpine
    container_name: bank_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - bank_net

volumes:
  postgres_data:

networks:
  bank_net:
    driver: bridge
